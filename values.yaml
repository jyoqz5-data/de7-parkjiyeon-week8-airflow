airflowVersion: "2.10.5"
defaultAirflowTag: "2.10.5"

executor: LocalExecutor

config:
  core:
    load_examples: "False"
  webserver:
    workers: "8"
    web_server_worker_timeout: "30"

webserver:
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 20
    failureThreshold: 10
    periodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 20
    failureThreshold: 10
    periodSeconds: 15
  startupProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 20
    failureThreshold: 30
    periodSeconds: 10

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/jyoqz5-data/de7-parkjiyeon-week8-airflow
    branch: main
    ref: main
    subPath: airflow-dags
    depth: 1
    wait: 10
    period: 10s

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r15
  primary:
    persistence:
      enabled: false

redis:
  enabled: false
